services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${CMS_DATABASE_USER:-cms}
      POSTGRES_PASSWORD: ${CMS_DATABASE_PASSWORD:-cms}
      POSTGRES_DB: ${CMS_DATABASE_NAME:-orthodox_cms}
    ports:
      - "${CMS_DATABASE_PORT:-5436}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
