name: orthodox
description: نقدم محتوى كتابيًا أرثوذكسيًا قبطيًا من خلال مناهج منظمة للأطفال والنشء، عبر منصة رقمية تخدم الكنائس والخدام والمخدومين، وتسعى إلى تأسيس دراسة منهجية راسخة للكتاب المقدس.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.4

  # Dependency Injection
  get_it: ^7.7.0
  injectable: ^2.4.2

  # Navigation
  go_router: ^14.2.0

  # HTTP Client
  dio: ^5.5.0

  # Local Storage
  hive_flutter: ^1.1.0
  hive: ^2.2.3

  # OTP Input
  pin_code_fields: ^8.0.1

  # Phone formatting
  intl_phone_field: ^3.2.0

  # UI
  flutter_svg: ^2.0.10
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0

  # Utils
  equatable: ^2.0.5
  dartz: ^0.10.1
  shared_preferences: ^2.2.3
  connectivity_plus: ^6.0.3
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.9
  injectable_generator: ^2.4.1
  hive_generator: ^2.0.0
#  bloc_test: ^9.1.5
  mocktail: ^1.0.0
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/

#  fonts:
