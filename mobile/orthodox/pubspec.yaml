name: orthodox
description: نقدم محتوى كتابيًا أرثوذكسيًا قبطيًا من خلال مناهج منظمة للأطفال والنشء، عبر منصة رقمية تخدم الكنائس والخدام والمخدومين، وتسعى إلى تأسيس دراسة منهجية راسخة للكتاب المقدس.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.4

  # Dependency Injection
  get_it: ^7.7.0
  injectable: ^2.4.2

  # Navigation
  go_router: ^14.2.0

  # HTTP Client
  dio: ^5.5.0

  # Local Storage
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  flutter_secure_storage: ^9.2.2

  # Utils
  equatable: ^2.0.5
  dartz: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.9
  injectable_generator: ^2.4.1
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
